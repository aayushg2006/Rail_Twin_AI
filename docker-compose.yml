# RAIL-TWIN — full stack. `docker compose up` brings up the twin backend
# (FastAPI + SimPy + XGBoost + OR-Tools), Postgres/PostGIS, Redis and the console.
# The backend degrades gracefully: if Postgres/Redis are unavailable it runs
# fully in-memory, so the demo never depends on them.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail
      POSTGRES_DB: railtwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail -d railtwin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      RAILTWIN_SEED: "42"
      RAILTWIN_DATABASE_URL: "postgresql://rail:rail@postgres:5432/railtwin"
      RAILTWIN_REDIS_URL: "redis://redis:6379/0"
      RAILTWIN_CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 8080"
    environment:
      VITE_BACKEND_WS_URL: "ws://localhost:8000/ws"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
