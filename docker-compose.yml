# RAIL-TWIN — full stack. `docker compose up` brings up the twin backend
# (FastAPI + SimPy + XGBoost + OR-Tools), Postgres/PostGIS, Redis and the console.
# The backend degrades gracefully: if Postgres/Redis are unavailable it runs
# fully in-memory, so the demo never depends on them.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rail
      POSTGRES_PASSWORD: rail
      POSTGRES_DB: railtwin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rail -d railtwin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RAILTWIN_SEED: "42"
      RAILTWIN_DATABASE_URL: "postgresql://rail:rail@postgres:5432/railtwin"
      RAILTWIN_REDIS_URL: "redis://redis:6379/0"
      RAILTWIN_CORS_ORIGINS: "*"
      # RailRadar: `replay` drives the demo from the recorded feed with no key
      # and no network. Set MODE=live and supply a key in .env to go live; the
      # monthly budget guard then caps spend at the free tier's 1,000 calls.
      RAILTWIN_RAILRADAR_MODE: "${RAILTWIN_RAILRADAR_MODE:-replay}"
      RAILTWIN_RAILRADAR_API_KEY: "${RAILTWIN_RAILRADAR_API_KEY:-}"
      RAILTWIN_RAILRADAR_MONTHLY_BUDGET: "${RAILTWIN_RAILRADAR_MONTHLY_BUDGET:-1000}"
      RAILTWIN_RAILRADAR_BOARD_SECONDS: "${RAILTWIN_RAILRADAR_BOARD_SECONDS:-60}"
      RAILTWIN_RAILRADAR_DETAIL_SECONDS: "${RAILTWIN_RAILRADAR_DETAIL_SECONDS:-300}"
      RAILTWIN_RAILRADAR_RESERVE: "${RAILTWIN_RAILRADAR_RESERVE:-150}"
      RAILTWIN_RAILRADAR_BASE_URL: "${RAILTWIN_RAILRADAR_BASE_URL:-https://api.railradar.in}"
      RAILTWIN_RAILRADAR_WATCHLIST_SIZE: "${RAILTWIN_RAILRADAR_WATCHLIST_SIZE:-6}"
      RAILTWIN_RAILRADAR_REPLAY_FILE: "/srv/data/railradar-replay.json"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./backend/app:/srv/app
      - ./backend/tests:/srv/tests:ro
      - ./backend/conftest.py:/srv/conftest.py:ro
      - ./data:/srv/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    working_dir: /app
    environment:
      VITE_BACKEND_WS_URL: "ws://localhost:8000/ws"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
      - frontend_node_modules_node24:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules_node24:
